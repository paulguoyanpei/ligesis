[workspace]
members = [
    "logup",
    "pcs",
    "proofsys",
    "utils",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
blake3 = "1.5.5"
p3-dft = "0.5.3"
p3-field = "0.5.3"
p3-goldilocks = "0.5.3"
rs_merkle = "1.5.0"
rand = "0.10.1"
utils = { path = "utils" }
logup = { path = "logup" }
